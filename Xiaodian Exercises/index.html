<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f0e7">
  <meta name="color-scheme" content="light">
  <meta name="description" content="小点刷题：导入 Excel 题库，支持做题、背题、限时考试三种模式，覆盖单选、多选与判断题。">
  <meta name="application-name" content="小点刷题">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小点刷题">
  <title>小点刷题 · 把每一道题，练成直觉</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="boot-screen" aria-label="正在载入">
      <span class="boot-mark">点</span>
      <span>正在准备你的题库…</span>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <noscript>
    <div class="noscript">小点刷题需要 JavaScript 才能运行，请在浏览器设置中开启后刷新页面。</div>
  </noscript>
  <script src="js/xlsx-reader.js"></script>
